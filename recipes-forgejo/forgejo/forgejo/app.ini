APP_NAME = Forgejo
RUN_USER = forgejo
WORK_PATH = /data/forgejo

[server]
PROTOCOL = https
APP_DATA_PATH = /data/forgejo
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = https://localhost:3000/
CERT_FILE = /data/forgejo/ssl/forgejo.crt
KEY_FILE = /data/forgejo/ssl/forgejo.key
DISABLE_SSH = false
SSH_ROOT_PATH = /data/forgejo/.ssh

[database]
DB_TYPE = postgres
HOST = /tmp
NAME = forgejo
USER = forgejo
PASSWD_URI = file:/data/forgejo/db_passwd
SSL_MODE = disable

[repository]
ROOT = /data/forgejo/repositories

[log]
MODE = console
LEVEL = Info
ROOT_PATH = /data/forgejo/log

[picture]
AVATAR_UPLOAD_PATH = /data/forgejo/data/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /data/forgejo/data/repo-avatars

[attachment]
PATH = /data/forgejo/data/attachments

[session]
PROVIDER_CONFIG = /data/forgejo/data/sessions

[oauth2]
JWT_SECRET_URI = file:/data/forgejo/jwt_secret
